name: Intelligence Router Persistence Validation

on:
  push:
    branches:
      - stabilize/intelligence-router-persistence-chat6

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/skycoin
      STRIPE_API_KEY: sk_test_51MockKeyForTestingOnly0000000000
      OPENAI_API_KEY: sk-proj-MockKeyForTestingOnly00000000000000000000
      ADMIN_WALLET_ADDRESS: "0x16188a203a715de6b131e273b3a9bcf6d09e7d0a"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skycoin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Initialize typed persistence schema
        run: pnpm exec drizzle-kit push --force

      - name: Run focused intelligence tests
        run: pnpm exec vitest run server/intelligence-engine.test.ts server/intelligence-router.persistence.test.ts

      - name: Measure TypeScript debt
        shell: bash
        run: |
          set +e
          pnpm check 2>&1 | tee typecheck.log
          total_errors=$(grep -c "error TS" typecheck.log || true)
          router_errors=$(grep -c "server/intelligence-router.ts" typecheck.log || true)
          engine_errors=$(grep -c "server/intelligence-engine.ts" typecheck.log || true)
          repo_errors=$(grep -c "server/db-intelligence.ts" typecheck.log || true)
          persistence_test_errors=$(grep -c "server/intelligence-router.persistence.test.ts" typecheck.log || true)
          echo "total_errors=$total_errors"
          echo "router_errors=$router_errors"
          echo "engine_errors=$engine_errors"
          echo "repo_errors=$repo_errors"
          echo "persistence_test_errors=$persistence_test_errors"
          if [ "$router_errors" -ne 0 ] || [ "$engine_errors" -ne 0 ] || [ "$repo_errors" -ne 0 ] || [ "$persistence_test_errors" -ne 0 ]; then
            grep -E "server/(intelligence-router|intelligence-engine|db-intelligence|intelligence-router\.persistence\.test)\.ts" typecheck.log || true
            exit 1
          fi

      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: High-severity dependency audit
        run: pnpm audit --audit-level=high
