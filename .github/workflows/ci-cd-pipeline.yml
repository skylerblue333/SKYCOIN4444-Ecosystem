name: SKYCOIN4444 Beta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Type Debt Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (baseline debt)
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm check 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          errors=$(grep -c "error TS" typecheck.log || true)
          echo "errors=$errors" >> "$GITHUB_OUTPUT"
          echo "### TypeScript stabilization debt" >> "$GITHUB_STEP_SUMMARY"
          echo "Current compiler error count: **$errors**" >> "$GITHUB_STEP_SUMMARY"
          echo "This report is temporarily non-blocking so test/build failures can be exposed in parallel. Beta release still requires this debt to be resolved or explicitly removed from the beta compilation scope." >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/skycoin
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skycoin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize test database schema
        run: pnpm exec drizzle-kit push --force

      - name: Verify beta-critical test tables
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";

          const db = await mysql.createConnection(process.env.DATABASE_URL);
          try {
            const [rows] = await db.query("SHOW TABLES");
            const present = new Set(rows.map(row => String(Object.values(row)[0])));
            const required = [
              "users",
              "dating_profiles",
              "dating_matches",
              "dating_messages",
              "dating_notifications",
            ];
            const missing = required.filter(table => !present.has(table));
            if (missing.length) {
              throw new Error(`Database bootstrap missing required tables: ${missing.join(", ")}`);
            }
            console.log(`Database bootstrap verified (${present.size} tables present).`);
          } finally {
            await db.end();
          }
          NODE

      - name: Run test suite
        run: pnpm test

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Upload production bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skycoin4444-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  backup_restore:
    name: Database Backup / Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/skycoin
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skycoin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize database schema
        run: pnpm exec drizzle-kit push --force

      - name: Seed restore probe
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";

          const db = await mysql.createConnection(process.env.DATABASE_URL);
          try {
            await db.execute(
              "CREATE TABLE backup_restore_probe (id INT PRIMARY KEY, marker VARCHAR(64) NOT NULL)"
            );
            await db.execute(
              "INSERT INTO backup_restore_probe (id, marker) VALUES (?, ?)",
              [4444, "skycoin4444-backup-restore-ok"]
            );
          } finally {
            await db.end();
          }
          NODE

      - name: Backup, destroy, and restore database
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker ps --filter "ancestor=mysql:8.0" -q | head -n 1)
          if [ -z "$cid" ]; then
            echo "Unable to locate the MySQL service container."
            exit 1
          fi

          docker exec "$cid" mysqldump -uroot -proot             --single-transaction             --routines             --triggers             --events             --no-tablespaces             skycoin > skycoin-backup.sql

          test -s skycoin-backup.sql

          docker exec "$cid" mysql -uroot -proot -e             "DROP DATABASE skycoin; CREATE DATABASE skycoin CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

          docker exec -i "$cid" mysql -uroot -proot skycoin < skycoin-backup.sql

      - name: Verify restored schema and data
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";

          const db = await mysql.createConnection(process.env.DATABASE_URL);
          try {
            const [tables] = await db.query("SHOW TABLES");
            const present = new Set(tables.map(row => String(Object.values(row)[0])));
            for (const required of ["users", "posts", "messages", "backup_restore_probe"]) {
              if (!present.has(required)) {
                throw new Error(`Restored database is missing required table: ${required}`);
              }
            }

            const [rows] = await db.execute(
              "SELECT marker FROM backup_restore_probe WHERE id = ?",
              [4444]
            );
            if (rows.length !== 1 || rows[0].marker !== "skycoin4444-backup-restore-ok") {
              throw new Error("Restore probe data did not survive backup/restore.");
            }

            console.log(`Backup/restore verified: ${present.size} tables and probe row restored.`);
          } finally {
            await db.end();
          }
          NODE

      - name: Upload backup drill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-backup-restore-drill
          path: skycoin-backup.sql
          if-no-files-found: warn
          retention-days: 2

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for committed secrets
        run: pnpm security:secrets

      - name: Block high-severity dependency vulnerabilities
        run: pnpm audit --audit-level=high
