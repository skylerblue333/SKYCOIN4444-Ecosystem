name: SKYCOIN4444 Beta CI

on:
  push:
    branches: [main, "stabilize/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Type Debt Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript debt no-regression gate
        id: typecheck
        env:
          TYPE_DEBT_REPORT_FILE: typecheck.log
        run: pnpm check:type-debt

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/skycoin
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skycoin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize test database schema
        run: pnpm exec drizzle-kit push --force

      - name: Verify beta-critical test tables
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";

          const db = await mysql.createConnection(process.env.DATABASE_URL);
          try {
            const [rows] = await db.query("SHOW TABLES");
            const present = new Set(rows.map(row => String(Object.values(row)[0])));
            const required = [
              "users",
              "dating_profiles",
              "dating_matches",
              "dating_messages",
              "dating_notifications",
            ];
            const missing = required.filter(table => !present.has(table));
            if (missing.length) {
              throw new Error(`Database bootstrap missing required tables: ${missing.join(", ")}`);
            }
            console.log(`Database bootstrap verified (${present.size} tables present).`);
          } finally {
            await db.end();
          }
          NODE

      - name: Run test suite
        run: pnpm test

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Upload production bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skycoin4444-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Runtime Smoke & Resilience
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/skycoin
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: ci-runtime-smoke-secret-not-for-production
      VITE_APP_ID: ci-runtime-smoke
      VITE_BETA_AUTH_MODE: access_key
      BETA_ACCESS_KEY: ci-runtime-smoke-beta-access-key-00000000000000000000000000000000
      BETA_ALLOWED_EMAILS: ci-session@example.invalid
      SKYCOIN_RELEASE_SHA: ${{ github.sha }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skycoin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: skycoin4444-dist
          path: dist

      - name: Initialize runtime database
        run: pnpm exec drizzle-kit push --force

      - name: Boot production server
        shell: bash
        run: |
          node dist/index.js > runtime-smoke.log 2>&1 &
          echo $! > runtime-smoke.pid
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /tmp/healthz.json; then
              exit 0
            fi
            sleep 1
          done
          cat runtime-smoke.log
          exit 1

      - name: Verify readiness and release identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("http://127.0.0.1:3000/api/beta/readiness");
          const body = await response.json();
          if (response.status !== 200) {
            throw new Error(`Readiness returned ${response.status}: ${JSON.stringify(body)}`);
          }
          if (body.status !== "ready") throw new Error("Runtime did not report ready");
          if (body.release !== process.env.SKYCOIN_RELEASE_SHA) {
            throw new Error(`Release mismatch: ${body.release} !== ${process.env.SKYCOIN_RELEASE_SHA}`);
          }
          if (body.services?.database?.ready !== true) {
            throw new Error("Database readiness was not proven");
          }
          if (body.services?.authentication?.ready !== true) {
            throw new Error("Authentication configuration readiness was not proven");
          }
          if (body.services?.authentication?.providers?.betaAccess !== true) {
            throw new Error("Beta access provider readiness was not proven");
          }
          if (body.services?.authentication?.providers?.oauth !== false) {
            throw new Error("Runtime smoke unexpectedly depends on OAuth");
          }
          NODE

      - name: Seed and verify persistent auth session
        shell: bash
        run: |
          node scripts/runtime-session-persistence.mjs seed
          node scripts/runtime-session-persistence.mjs verify

      - name: Restart production server
        shell: bash
        run: |
          if [ -f runtime-smoke.pid ]; then
            kill "$(cat runtime-smoke.pid)" 2>/dev/null || true
            for attempt in {1..20}; do
              if ! kill -0 "$(cat runtime-smoke.pid)" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
          fi
          node dist/index.js >> runtime-smoke.log 2>&1 &
          echo $! > runtime-smoke.pid
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /tmp/healthz-after-restart.json; then
              exit 0
            fi
            sleep 1
          done
          cat runtime-smoke.log
          exit 1

      - name: Verify session survives process restart
        shell: bash
        run: node scripts/runtime-session-persistence.mjs verify

      - name: Concurrent liveness smoke
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const total = 120;
          const concurrency = 20;
          let next = 0;
          let failures = 0;
          const latencies = [];

          async function worker() {
            while (true) {
              const current = next++;
              if (current >= total) return;
              const started = performance.now();
              try {
                const response = await fetch("http://127.0.0.1:3000/healthz");
                if (response.status !== 200) failures++;
                await response.arrayBuffer();
              } catch {
                failures++;
              } finally {
                latencies.push(performance.now() - started);
              }
            }
          }

          await Promise.all(Array.from({ length: concurrency }, () => worker()));
          latencies.sort((a, b) => a - b);
          const p95 = latencies[Math.min(latencies.length - 1, Math.floor(latencies.length * 0.95))] ?? 0;
          console.log(`Concurrent liveness: ${total - failures}/${total} succeeded; p95=${p95.toFixed(1)}ms`);
          if (failures > 0) throw new Error(`${failures} concurrent liveness requests failed`);
          if (p95 > 1500) throw new Error(`Liveness p95 too high: ${p95.toFixed(1)}ms`);
          NODE

      - name: Verify missing Stripe provider fails closed
        shell: bash
        run: |
          status=$(curl --silent --output /tmp/stripe.json --write-out "%{http_code}"             --request POST             --header "Content-Type: application/json"             --data '{}'             http://127.0.0.1:3000/api/stripe/webhook)
          test "$status" = "400"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const body = JSON.parse(await readFile("/tmp/stripe.json", "utf8"));
          if (body.error !== "Webhook secret not configured") {
            throw new Error(`Unexpected Stripe failure response: ${JSON.stringify(body)}`);
          }
          NODE
          curl --fail --silent http://127.0.0.1:3000/healthz > /dev/null

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -f runtime-smoke.pid ]; then
            kill "$(cat runtime-smoke.pid)" 2>/dev/null || true
          fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-log
          path: runtime-smoke.log
          if-no-files-found: warn
          retention-days: 7

  docker-image:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag skycoin4444:ci .

      - name: Verify image entrypoint artifact
        run: |
          docker run --rm --entrypoint sh skycoin4444:ci -c 'test -f /app/dist/index.js'

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for committed secrets
        run: pnpm security:secrets

      - name: Block high-severity dependency vulnerabilities
        run: pnpm audit --audit-level=high
