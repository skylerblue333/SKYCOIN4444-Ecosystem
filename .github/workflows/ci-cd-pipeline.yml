name: SKYCOIN4444 Beta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Type Debt Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (baseline debt)
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm check 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          errors=$(grep -c "error TS" typecheck.log || true)
          echo "errors=$errors" >> "$GITHUB_OUTPUT"
          echo "### TypeScript stabilization debt" >> "$GITHUB_STEP_SUMMARY"
          echo "Current compiler error count: **$errors**" >> "$GITHUB_STEP_SUMMARY"
          echo "This report is temporarily non-blocking so test/build failures can be exposed in parallel. Beta release still requires this debt to be resolved or explicitly removed from the beta compilation scope." >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skycoin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [validate, test]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Upload production bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skycoin4444-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Block high-severity dependency vulnerabilities
        run: pnpm audit --audit-level=high
