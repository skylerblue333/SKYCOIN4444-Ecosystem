name: SKYCOIN4444 Deployment Preflight

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to prepare"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  preflight:
    name: Validate deployable build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/skycoin
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skycoin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript debt no-regression gate
        run: pnpm check:type-debt

      - name: Initialize preflight database schema
        run: pnpm exec drizzle-kit push --force

      - name: Run tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Record deployment status
        run: |
          echo "## SKYCOIN4444 deployment preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build validation completed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No production deployment was performed. The previous workflow contained unverified AWS resource names, so deployment remains intentionally gated until the real hosting target, credentials, task/service identifiers, health endpoint, and rollback procedure are verified." >> "$GITHUB_STEP_SUMMARY"
