name: Dependency Autofix Preview

on:
  push:
    branches:
      - stabilize/beta-launch-gates-2026-09-23
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install current lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate audit overrides
        run: pnpm audit --fix || true

      - name: Re-resolve lockfile with security overrides
        run: pnpm install --no-frozen-lockfile

      - name: Verify high severity findings are cleared
        run: pnpm audit --audit-level=high

      - name: Upload regenerated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-autofix-preview
          path: |
            package.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 2
