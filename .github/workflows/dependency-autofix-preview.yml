name: Dependency Autofix Preview

on:
  push:
    branches:
      - stabilize/beta-launch-gates-2026-09-23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install current lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate audit overrides
        run: pnpm audit --fix || true

      - name: Re-resolve lockfile with security overrides
        run: pnpm install --no-frozen-lockfile

      - name: Generate second-order audit overrides
        run: pnpm audit --fix || true

      - name: Re-resolve second-order overrides
        run: pnpm install --no-frozen-lockfile

      - name: Verify high severity findings are cleared
        run: pnpm audit --audit-level=high

      - name: Commit verified dependency remediation
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "deps: apply audit-generated security remediation"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload regenerated dependency files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-autofix-preview
          path: |
            package.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 2
