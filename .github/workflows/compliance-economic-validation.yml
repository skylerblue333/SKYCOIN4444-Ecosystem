name: Compliance Economic Stabilization Validation

on:
  push:
    branches:
      - stabilize/compliance-economic-router-wiring-chat6

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/skycoin
      STRIPE_API_KEY: sk_test_51MockKeyForTestingOnly0000000000
      OPENAI_API_KEY: sk-proj-MockKeyForTestingOnly00000000000000000000
      ADMIN_WALLET_ADDRESS: "0x16188a203a715de6b131e273b3a9bcf6d09e7d0a"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skycoin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused router regression tests
        run: pnpm exec vitest run server/stabilization-router-wiring.test.ts server/platform.test.ts

      - name: Measure TypeScript debt
        shell: bash
        run: |
          set +e
          pnpm check 2>&1 | tee typecheck.log
          total_errors=$(grep -c "error TS" typecheck.log || true)
          target_errors=$(grep -E -c "server/(compliance-router|economic-router|routers)\.ts|client/src/pages/(ComplianceCenter|EconomicLayer)\.tsx" typecheck.log || true)
          echo "total_errors=$total_errors"
          echo "target_errors=$target_errors"
          if [ "$target_errors" -ne 0 ]; then
            grep -E "server/(compliance-router|economic-router|routers)\.ts|client/src/pages/(ComplianceCenter|EconomicLayer)\.tsx" typecheck.log
            exit 1
          fi
          exit 0

      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: High-severity dependency audit
        run: pnpm audit --audit-level=high
